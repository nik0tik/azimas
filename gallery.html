<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Применяем тему ДО рендеринга, чтобы не мерцало -->
  <script>
    (function() {
      const theme = localStorage.getItem('azimas-theme') || 'dark';
      if (theme !== 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    })();
  </script>
  <title>Gallery — Azimas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>KINGDOM OF AZIMAS</h1>
  <p>Lorebook</p>
  <div class="theme-switcher">
    <button data-theme="dark">✮ Dark</button>
    <button data-theme="light">📜 Light</button>
  </div>
</header>




  <main>
