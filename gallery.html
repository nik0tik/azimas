<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Применяем тему ДО рендеринга, чтобы не мерцало -->
  <script>
    (function() {
      const theme = localStorage.getItem('azimas-theme') || 'dark';
      if (theme !== 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    })();
  </script>
  <title>Gallery — Azimas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>KINGDOM OF AZIMAS</h1>
  <p>Lorebook</p>
  <div class="theme-switcher">
    <button data-theme="dark">✮ Dark</button>
    <button data-theme="light">📜 Light</button>
  </div>
</header>




  <main>
    <h2>Gallery</h2>
    <p>Illustrations and random extra art. Over time, I will add new pics if I don’t get lazy.</p>
    <img src="images/dividers/roses.jpg" alt="" class="no-zoom divider">

  <h2>Octopus Coven</h2>
  <p>Witches of the Octopus Coven.</p>

  <div class="gallery-grid portrait">
    <img src="images/gallery/iris_tears.jpg" alt="Iris crying" data-caption="Iris crying">
    <img src="images/witches/Selena_full.png" alt="Selena" data-caption="Selena Veira">
    <img src="images/witches/Mirelle_full_2.png" alt="Mirelle" data-caption="Mirelle Dallas">
    <img src="images/witches/iris_full.png" alt="Iris" data-caption="Iris Daanen">
    <img src="images/witches/Talia_full.png" alt="Talia" data-caption="Talia Moen">
    <img src="images/witches/nora_full.png" alt="Nora" data-caption="Nora Feld">
    <img src="images/witches/etta_full.png" alt="Etta" data-caption="Etta Croy">
    <img src="images/witches/Laura_full.png" alt="Laura" data-caption="Laura">
    <img src="images/witches/margot_full.png" alt="Margot" data-caption="Margot">
    <img src="images/witches/zaira_full.png" alt="Zaira" data-caption="Zaira Veira">
  </div>

  <h2>Locations</h2>
  <p>Beautiful places of Azimas.</p>

  <div class="gallery-grid cols-3">
    <img src="images/locations/Azimas.jpg" alt="Noxland" data-caption="Noxland">
    <img src="images/locations/faihaven.jpg" alt="Fairhaven" data-caption="Fairhaven">
    <img src="images/locations/sidehill.png" alt="Sidehill" data-caption="Sidehill">
    <img src="images/locations/whitevale.jpg" alt="Whitevale" data-caption="Whitevale">
  </div>

  <h2>Random Art</h2>

  <div class="gallery-grid no-scroll">
    <img src="images/other/COMING_SOON.png" alt="">
    <img src="images/other/COMING_SOON.png" alt="">
    <img src="images/other/COMING_SOON.png" alt="">
  </div>

  </main>
  <script src="nav.js"></script>
  <script src="lightbox.js"></script>

</body>

</html>
